paths:
  data_raw: "data/raw"
  data_interim: "data/interim"
  data_processed: "data/processed"
  data_eval: "data/eval"
  corpus_pdfs: "data/corpus_pdfs"
  models_dir: "models"
  results_raw: "results/raw"
  results_figs: "results/figs"
  results_tables: "results/tables"
  chroma_db_dir: "data/interim/chroma_db"
  log_file: "results/LOG.md"

seeds:
  default: 42
  numpy: 42
  torch: 42
  python: 42

models:
  embedding:
    name: "BAAI/bge-m3"
    dim: 1024
    max_length: 8192
    device_query: "cpu"
    device_ingest: "cuda"
  summarizer:
    base: "ai4bharat/IndicBART"
    lora_adapter: "models/indicbart_lora_merged"
    max_source_tokens: 512
    max_target_tokens: 64
  llm:
    model_id: "qwen2.5:1.5b-instruct-q4_K_M"
    gguf_file: "models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
    gguf_repo: "Qwen/Qwen2.5-1.5B-Instruct-GGUF"
    gguf_filename: "qwen2.5-1.5b-instruct-q4_k_m.gguf"
  transliteration:
    engine: "indicxlit"
    languages: ["hi", "kn"]

chunking:
  target_tokens: 300
  overlap_tokens: 50
  tokenizer: "BAAI/bge-m3"

retrieval:
  top_k: 10
  top_k_evidence: 3
  tau_hi: 0.65
  tau_lo: 0.45
  distance_metric: "cosine"

llm:
  server_url: "http://127.0.0.1:11434"
  model_name: "qwen2.5:1.5b"
  ctx: 4096
  temperature: 0.1
  max_tokens: 512

training:
  base_model: "ai4bharat/IndicBART"
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "out_proj", "fc1", "fc2"]
  precision: "fp16"
  directions: ["en-en", "en-hi", "en-kn", "hi-hi", "kn-kn"]
  max_train_samples_per_dir: 3000
  max_val_samples_per_dir: 200
  max_test_samples_per_dir: 200
  lr: 0.0003
  batch_size: 8
  gradient_accumulation_steps: 4
  epochs: 3
  warmup_ratio: 0.05
  label_smoothing: 0.1
  time_box_minutes: 100

eval:
  rouge_tokenizer: "unicode"
  bootstrap_resamples: 1000
  confidence_level: 0.95

runtime:
  mode: "qa"
  vram_budget_mb: 4096
  hf_offline: true
